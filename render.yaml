services:
  - type: web
    name: truck-weather-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # One worker + threads: the in-memory weather/route cache is shared and upstream calls are I/O bound.
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: MAPBOX_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
